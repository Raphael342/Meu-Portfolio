<!DOCTYPE html>
<html lang="pt_br">
<head>
    <link href="https://googleapis.com" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My own MainPage</title>
    <link rel="stylesheet" href="LaStyles.CSS">
    <link rel="icon" type="image/x-icon" href="Lasanha.png">
</head>
<body>

    <div class="Central">
        <div class="MainTittle">
            <img src="Lasanha.png" alt="">
            <h1>Lasanha.com</h1>
        </div>
    
        <form action="https://google.com" method="get" target="_blank">
            <div class="search-box">
                <input type="text" name="q" placeholder="Pesquisar no Lasanha.com" autofocus required>
            </div>
        </form>
    
        <div class="linl-grid">

            <a href="https://youtube.com" target="_blank" class="shortcut-card">
                <div class="icon-wrapper">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube">
                </div>
                <span>YouTube</span>
            </a>

            <a href="https://github.com" target="_blank" class="shortcut-card">
                <div class="icon-wrapper">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub">
                </div>
                <span>GitHub</span>
            </a>

            <a href="https://chatgpt.com" target="_blank" class="shortcut-card">
                <div class="icon-wrapper">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMdM9MEQ0ExL1PmInT3U5I8v63YXBEdoIT0Q&s" alt="ChatGPT">
                </div>
                <span>ChatGPT</span>
            </a>

            <a href="https://web.whatsapp.com/" target="_blank" class="shortcut-card">
                <div class="icon-wrapper">
                    <img src="https://i.pinimg.com/736x/c4/9c/a2/c49ca2acb2de3f97cab50b6d927244b4.jpg" alt="WhatsApp">
                </div>
                <span>WhatsApp</span>
            </a>

            <a href="https://soundcloud.com/" target="_blank" class="shortcut-card">
                <div class="icon-wrapper">
                    <img src="https://cdn-icons-png.flaticon.com/512/145/145809.png" alt="SoundCloud">
                </div>
                <span>SoundCloud</span>
            </a>
        </div>
    <footer class="rodape">
        <p>&copy; 2026 Lasanha.com. Todos os direitos reservados</p>
    </footer>
</body>
</html>
